<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3787"/>
      <stop offset="30%" stop-color="#e11e73"/>
      <stop offset="68%" stop-color="#80084e"/>
      <stop offset="100%" stop-color="#180316"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ff287a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff287a" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.09"/>
    </linearGradient>

    <!-- Gold Ring Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8b9"/>
      <stop offset="100%" stop-color="#c3690c"/>
    </linearGradient>

    <!-- Heart 3D Gradient -->
    <linearGradient id="heartGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#ffd7e6"/>
      <stop offset="68%" stop-color="#f43773"/>
      <stop offset="100%" stop-color="#b40a41"/>
    </linearGradient>

    <!-- Pill Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef5c8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glass Surface Sheen -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#140010" flood-opacity="0.5"/>
    </filter>

    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#460020" flood-opacity="0.55"/>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <clipPath id="squircleClip">
    <rect width="512" height="512" rx="118"/>
  </clipPath>

  <g clip-path="url(#squircleClip)">
    <!-- 1. Background -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>
    <rect width="512" height="280" fill="url(#topGlow)"/>

    <!-- 2. Floating Frosted Calendar Card -->
    <g filter="url(#cardShadow)">
      <rect x="50" y="70" width="412" height="385" rx="56" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.7"/>
      <!-- Split Crease -->
      <line x1="72" y1="255" x2="440" y2="255" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.25"/>
    </g>

    <!-- 3. Golden Calendar Binder Rings -->
    <g>
      <rect x="136" y="44" width="24" height="52" rx="12" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.9"/>
      <rect x="352" y="44" width="24" height="52" rx="12" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.9"/>
    </g>

    <!-- 4. 3D Sculpted Primary Heart -->
    <g filter="url(#heartShadow)">
      <path d="M 256, 163 C 218, 106 145, 106 119, 150 C 93, 197 111, 250 171, 302 C 224, 344 256, 375 256, 375 C 256, 375 288, 344 341, 302 C 401, 250 419, 197 393, 150 C 367, 106 294, 106 256, 163 Z"
            fill="url(#heartGrad)"
            stroke="#ffffff"
            stroke-width="2"
            stroke-opacity="0.8"/>
    </g>

    <!-- 5. Inner Interlocking Golden Heart Ribbon -->
    <g filter="url(#goldGlow)">
      <path d="M 256, 218 C 236, 188 198, 188 184, 211 C 170, 235 180, 263 211, 290 C 239, 312 256, 328 256, 328 C 256, 328 273, 312 301, 290 C 332, 263 342, 235 328, 211 C 314, 188 276, 188 256, 218 Z"
            fill="none"
            stroke="url(#goldGrad)"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- 6. Golden Pill Badge: DAY BY DAY -->
    <g filter="url(#cardShadow)">
      <rect x="163" y="384" width="186" height="42" rx="21" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="1.5"/>
      <text x="256" y="410" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12.5" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="1">DAY BY DAY</text>
    </g>

    <!-- 7. Sparkle Stars -->
    <g fill="#ffffff" opacity="0.95">
      <path d="M 106, 158 L 110, 170 L 122, 172 L 110, 174 L 106, 186 L 102, 174 L 90, 172 L 102, 170 Z"/>
      <path d="M 402, 142 L 407, 157 L 422, 160 L 407, 163 L 402, 178 L 397, 163 L 382, 160 L 397, 157 Z"/>
      <path d="M 388, 335 L 391, 343 L 399, 345 L 391, 347 L 388, 355 L 385, 347 L 377, 345 L 385, 343 Z" opacity="0.8"/>
    </g>

    <!-- 8. Glass Sheen Reflection -->
    <rect width="512" height="190" fill="url(#glassSheen)"/>
  </g>
</svg>